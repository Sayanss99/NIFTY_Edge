<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiftyEdge</title>
    <script>
        // Redirect based on auth state
        const token = localStorage.getItem('niftyedge_token');
        if (token) {
            window.location.href = '/dashboard';
        } else {
            window.location.href = '/login';
        }
    </script>
</head>
<body></body>
</html>
