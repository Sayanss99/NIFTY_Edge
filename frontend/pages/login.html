<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NiftyEdge — Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>NiftyEdge</h1>
            <p class="subtitle">NIFTY Options Trading Dashboard</p>

            <div id="login-error" class="login-error"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
            </form>

            <!-- Signup Form (hidden by default) -->
            <form id="signup-form" class="hidden">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="signup-name" class="form-input" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="signup-password" class="form-input" placeholder="Min 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" id="signup-btn">Create Account</button>
            </form>

            <div class="login-toggle">
                <span id="toggle-text">Don't have an account?</span>
                <a href="#" id="toggle-link" onclick="toggleForm(event)">Sign up</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let isLogin = true;

        function toggleForm(e) {
            e.preventDefault();
            isLogin = !isLogin;
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('signup-form').classList.toggle('hidden', isLogin);
            document.getElementById('toggle-text').textContent = isLogin
                ? "Don't have an account?"
                : "Already have an account?";
            document.getElementById('toggle-link').textContent = isLogin ? 'Sign up' : 'Sign in';
            document.getElementById('login-error').textContent = '';
        }

        // Redirect if already logged in
        if (API.getToken()) {
            window.location.href = '/dashboard';
        }

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const resp = await API.login(
                    document.getElementById('login-email').value,
                    document.getElementById('login-password').value,
                );
                if (resp.access_token) {
                    API.saveAuth(resp);
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('login-error').textContent = resp.detail || 'Login failed';
                }
            } catch (err) {
                document.getElementById('login-error').textContent = 'Connection error';
            }

            btn.disabled = false;
            btn.textContent = 'Sign In';
        });

        // Signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const resp = await API.signup(
                    document.getElementById('signup-email').value,
                    document.getElementById('signup-name').value,
                    document.getElementById('signup-password').value,
                );
                if (resp.access_token) {
                    API.saveAuth(resp);
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('login-error').textContent = resp.detail || 'Signup failed';
                }
            } catch (err) {
                document.getElementById('login-error').textContent = 'Connection error';
            }

            btn.disabled = false;
            btn.textContent = 'Create Account';
        });
    </script>
</body>
</html>
