<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratovex — Option Chain</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .lookup-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .lookup-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }
        /* CE = soft-cyan, PE = muted coral (consistent with Stock Options). */
        .lookup-card.ce { border-top: 3px solid #26C6DA; }
        .lookup-card.pe { border-top: 3px solid #F0857A; }
        .lookup-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .lookup-input-row input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            font-family: var(--font-mono);
        }
        .lookup-result {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .lookup-metric {
            text-align: center;
        }
        .lookup-metric .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .lookup-metric .value {
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .chain-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow: auto;
            max-height: calc(100vh - 340px);
            box-shadow: var(--shadow-sm);
        }
        .chain-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .chain-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .chain-table th {
            padding: 8px 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            background: var(--bg-card);
        }
        .chain-table th.ce-header { background: #ECFCFF; color: #0E7C8C; text-align: right; }
        .chain-table th.pe-header { background: #FFF1ED; color: #C25749; text-align: left; }
        .chain-table th.strike-header { background: var(--bg-table-header); text-align: center; }
        [data-theme="dark"] .chain-table th.ce-header { background: #0E2A30; color: #67E8F9; }
        [data-theme="dark"] .chain-table th.pe-header { background: #2E1A17; color: #F6A99F; }
        [data-theme="dark"] .chain-table th.strike-header { background: var(--bg-secondary); }
        .chain-table td { padding: 5px 8px; border-bottom: 1px solid var(--border-light); }
        .chain-table td.ce-cell { text-align: right; }
        .chain-table td.pe-cell { text-align: left; }
        .chain-table td.strike-cell {
            text-align: center;
            font-weight: 700;
            background: var(--bg-table-strike);
            cursor: pointer;
            user-select: none;
        }
        .chain-table tr:hover td { background: var(--bg-hover); }
        .chain-table tr:hover td.strike-cell { background: var(--bg-secondary); }
        .chain-table tr.atm td { background: rgba(253, 230, 138, 0.3) !important; font-weight: 600; }
        .chain-table tr.atm td.strike-cell { background: rgba(253, 230, 138, 0.5) !important; }
        /* Premium tint based on ranking */
        .chain-table td.premium-sweet { background: rgba(22, 163, 74, 0.06); }
        .chain-table td.premium-very-low { background: rgba(220, 38, 38, 0.06); }
        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }
        .seg-toggle { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
        .seg-toggle .seg { border:none; background:transparent; padding:5px 12px; font-size:12px;
            font-weight:700; cursor:pointer; color:var(--text-secondary); line-height:1.4; }
        .seg-toggle .seg.active { background:var(--primary,#2563EB); color:#fff; }
        .btn-success { background:#16A34A; color:#fff; border:none; }
        .btn-success:hover { background:#15803D; }
        .btn-danger  { background:#DC2626; color:#fff; border:none; }
        .btn-danger:hover  { background:#B91C1C; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content">
            <header class="header" id="header"></header>
            <div class="page-content">
                <!-- Strike Lookup Panel -->
                <div class="lookup-panel">
                    <!-- CE Lookup -->
                    <div class="lookup-card ce">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                            <span class="fw-600" style="color:#1796A8">CE Lookup</span>
                            <div id="ce-add-row" class="hidden" style="display:none;align-items:center;gap:6px">
                                <button class="btn btn-sm btn-secondary" onclick="openSizingFromLookup('CE')" title="How many lots fit my risk budget?">⚖ Size</button>
                                <button class="btn btn-sm btn-danger" onclick="setAndAdd('CE','SELL')">↓ Sell</button>
                                <button class="btn btn-sm btn-success" onclick="setAndAdd('CE','BUY')">↑ Buy</button>
                            </div>
                        </div>
                        <div class="lookup-input-row">
                            <input type="number" id="ce-lookup-strike" placeholder="Strike" step="50">
                            <button class="btn btn-sm btn-secondary" onclick="lookupStrike('CE')">Lookup</button>
                        </div>
                        <div class="lookup-result" id="ce-lookup-result">
                            <div class="lookup-metric"><div class="label">LTP</div><div class="value" id="ce-lkp-ltp">-</div></div>
                            <div class="lookup-metric"><div class="label">Delta</div><div class="value" id="ce-lkp-delta">-</div></div>
                            <div class="lookup-metric"><div class="label">IV</div><div class="value" id="ce-lkp-iv">-</div></div>
                            <div class="lookup-metric"><div class="label">Rank</div><div class="value" id="ce-lkp-rank">-</div></div>
                        </div>
                    </div>

                    <!-- PE Lookup -->
                    <div class="lookup-card pe">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                            <span class="fw-600" style="color:#C25749">PE Lookup</span>
                            <div id="pe-add-row" class="hidden" style="display:none;align-items:center;gap:6px">
                                <button class="btn btn-sm btn-secondary" onclick="openSizingFromLookup('PE')" title="How many lots fit my risk budget?">⚖ Size</button>
                                <button class="btn btn-sm btn-danger" onclick="setAndAdd('PE','SELL')">↓ Sell</button>
                                <button class="btn btn-sm btn-success" onclick="setAndAdd('PE','BUY')">↑ Buy</button>
                            </div>
                        </div>
                        <div class="lookup-input-row">
                            <input type="number" id="pe-lookup-strike" placeholder="Strike" step="50">
                            <button class="btn btn-sm btn-secondary" onclick="lookupStrike('PE')">Lookup</button>
                        </div>
                        <div class="lookup-result" id="pe-lookup-result">
                            <div class="lookup-metric"><div class="label">LTP</div><div class="value" id="pe-lkp-ltp">-</div></div>
                            <div class="lookup-metric"><div class="label">Delta</div><div class="value" id="pe-lkp-delta">-</div></div>
                            <div class="lookup-metric"><div class="label">IV</div><div class="value" id="pe-lkp-iv">-</div></div>
                            <div class="lookup-metric"><div class="label">Rank</div><div class="value" id="pe-lkp-rank">-</div></div>
                        </div>
                    </div>
                </div>

                <!-- Filter Bar -->
                <div class="filter-bar">
                    <div class="seg-toggle" id="chain-mode-toggle" title="Index vs Stock symbol">
                        <button type="button" id="chain-mode-ind" class="seg active" onclick="setChainMode('IND')">IND</button>
                        <button type="button" id="chain-mode-sym" class="seg" onclick="setChainMode('SYM')">SYM</button>
                    </div>
                    <div id="oc-search-wrap" style="display:none;align-items:center;gap:6px">
                        <input list="symbol-options" id="symbol-search" placeholder="Type a symbol… (e.g. RELIANCE)" autocomplete="off"
                               style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font-mono);width:240px"
                               onchange="onSymbolPicked()" onkeydown="if(event.key==='Enter')onSymbolPicked()">
                        <datalist id="symbol-options"></datalist>
                    </div>
                    <span style="font-size:12px;color:var(--text-secondary)">Symbol: <strong id="chain-symbol">NIFTY</strong></span>
                    <span style="font-size:12px;color:var(--text-secondary)">Spot: <strong class="font-mono" id="chain-spot">-</strong></span>
                    <label style="font-size:12px;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" id="filter-range" onchange="renderChain()">
                        Show only strikes in range
                    </label>
                </div>

                <!-- Option Chain Table -->
                <div class="chain-container">
                    <table class="chain-table" id="chain-table">
                        <thead>
                            <tr>
                                <th class="ce-header">OI</th>
                                <th class="ce-header">IV</th>
                                <th class="ce-header">LTP</th>
                                <th class="ce-header">Delta</th>
                                <th class="strike-header">STRIKE</th>
                                <th class="pe-header">Delta</th>
                                <th class="pe-header">LTP</th>
                                <th class="pe-header">IV</th>
                                <th class="pe-header">OI</th>
                            </tr>
                        </thead>
                        <tbody id="chain-body">
                            <tr><td colspan="9" class="text-center text-muted" style="padding:40px">Loading option chain...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Trade Modal (redirects to positions page) -->

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/tweaks.js"></script>
    <script src="/js/ne-scroll.js"></script>
    <script src="/js/ne-live.js"></script>
    <script src="/js/sizing.js"></script>
    <script src="/js/ws.js"></script>
    <script>
        if (!API.requireAuth()) throw new Error('Not authenticated');

        document.getElementById('sidebar').innerHTML = Utils.buildSidebar('option-chain');
        document.getElementById('header').innerHTML = Utils.buildHeader('Option Chain');
        // Market-status text + alert bell; expiry selector stays managed by
        // this page's own loadChain() (skipExpiry avoids a populate race).
        Utils.initHeader({ skipExpiry: true });

        let chainData = [];
        let currentSpot = 0;
        let currentExpiry = '';
        let currentSymbol = 'NIFTY';
        let currentLot = null;
        // Last stock the user searched (remembered for the session so the SYM
        // toggle can restore it). NIFTY index stays the default backbone.
        let lastStockSymbol = sessionStorage.getItem('oc_last_symbol') || '';

        // IND/SYM toggle: IND hides the search bar (NIFTY index), SYM shows it.
        function _setOcToggle(mode) {
            document.getElementById('chain-mode-ind').classList.toggle('active', mode === 'IND');
            document.getElementById('chain-mode-sym').classList.toggle('active', mode === 'SYM');
            document.getElementById('oc-search-wrap').style.display = mode === 'SYM' ? 'flex' : 'none';
        }

        // Toggle handler: IND → NIFTY index; SYM → last searched symbol (or focus
        // the search bar to pick one).
        function setChainMode(mode) {
            if (mode === 'IND') {
                document.getElementById('symbol-search').value = '';
                loadChain('NIFTY', null);
                return;
            }
            _setOcToggle('SYM');
            if (lastStockSymbol) {
                document.getElementById('symbol-search').value = lastStockSymbol;
                loadChain(lastStockSymbol, null);
            } else {
                document.getElementById('symbol-search').focus();
            }
        }
        let lookupData = { CE: null, PE: null };
        // Default action is SELL (most common for option writers)
        let lookupAction = { CE: 'SELL', PE: 'SELL' };

        function setAndAdd(side, action) {
            lookupAction[side] = action;
            addTradeFromLookup(side);
        }

        // Sizing calculator from the lookup panel — pre-fills strike + LTP +
        // tradeType so the user only enters their ₹-at-risk budget.  No
        // onApply because the option chain page doesn't host an Add Trade
        // form directly (Buy/Sell jumps to Positions).
        function openSizingFromLookup(side) {
            const d = lookupData[side];
            if (!d) {
                Utils.showToast('Look up a strike first', 'error');
                return;
            }
            const tradeType = `${side}_${lookupAction[side] || 'SELL'}`;
            window.Sizing.open({
                tradeType,
                strike: d.strike,
                premium: d.ltp,
            });
        }

        // ── Symbol + chain loading ─────────────────────────────────────

        // Core loader — fetches the chain for a symbol/expiry, repopulates the
        // expiry dropdown, and re-renders. Used by initial load, expiry change
        // and symbol search alike.
        async function loadChain(symbol, expiry) {
            const r = await API.getOptionChain(expiry || null, symbol);
            if (!r || r.error) { Utils.toast(r?.error || `No chain for ${symbol}`, 'error'); return false; }
            chainData = r.data;
            currentSpot = r.spot;
            currentExpiry = r.selected_expiry;
            currentSymbol = (r.symbol || symbol || 'NIFTY').toUpperCase();
            currentLot = r.lot_size || null;
            document.getElementById('chain-symbol').textContent = currentSymbol;
            // Repopulate the expiry dropdown for this symbol
            const sel = document.getElementById('expiry-selector');
            if (sel && r.expiries) {
                sel.innerHTML = r.expiries.map(e => `<option value="${e}">${e}</option>`).join('');
                sel.value = currentExpiry || r.expiries[0];
            }
            renderChain();
            Utils.updateRefreshInfo(new Date().toISOString());
            // Persist the last-viewed chain for the whole browser session, so it
            // survives refreshes and page changes until the tab is closed.
            try {
                sessionStorage.setItem('oc_symbol', currentSymbol);
                sessionStorage.setItem('oc_expiry', currentExpiry || '');
            } catch (e) {}
            // Reflect the IND/SYM toggle from whatever is now loaded.
            if (currentSymbol === 'NIFTY') {
                _setOcToggle('IND');
            } else {
                lastStockSymbol = currentSymbol;
                try { sessionStorage.setItem('oc_last_symbol', currentSymbol); } catch (e) {}
                document.getElementById('symbol-search').value = currentSymbol;
                _setOcToggle('SYM');
            }
            return true;
        }

        // Triggered when the user picks a datalist suggestion or presses Enter —
        // no separate Search button needed.
        async function onSymbolPicked() {
            const sym = (document.getElementById('symbol-search').value || '').trim().toUpperCase();
            if (!sym || sym === currentSymbol) return;
            await loadChain(sym, null);
        }

        // Populate the symbol datalist for autocomplete
        (async () => {
            const f = await API.getFnoList();
            if (f && f.symbols) {
                document.getElementById('symbol-options').innerHTML =
                    f.symbols.map(s => `<option value="${s}">`).join('');
            }
        })();

        // ── Load initial data ──────────────────────────────────────────
        (async () => {
            const qp = new URLSearchParams(window.location.search);
            // Priority: explicit URL deep-link → last session-viewed chain → NIFTY.
            let initSymbol = (qp.get('symbol') || '').toUpperCase();
            let initExpiry = qp.get('expiry');
            if (!initSymbol) {
                initSymbol = (sessionStorage.getItem('oc_symbol') || 'NIFTY').toUpperCase();
                if (!initExpiry) initExpiry = sessionStorage.getItem('oc_expiry') || null;
            }

            // loadChain sets the IND/SYM toggle + search field based on what loads.
            await loadChain(initSymbol, initExpiry);

            // Deep-link from the Most-Active "Trade" button: pre-fill the CE/PE
            // lookup with the card's strike/side so it's ready to trade (the
            // Sell/Buy buttons appear with live LTP/delta/IV for that strike).
            const dlStrike = parseInt(qp.get('strike'));
            const dlSide = (qp.get('side') || '').toUpperCase();
            if (dlStrike && (dlSide === 'CE' || dlSide === 'PE')) {
                const inp = document.getElementById(dlSide.toLowerCase() + '-lookup-strike');
                if (inp) {
                    inp.value = dlStrike;
                    await lookupStrike(dlSide);
                    inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
            }

            // Expiry change handler (uses whichever symbol is active)
            const sel = document.getElementById('expiry-selector');
            if (sel) {
                sel.addEventListener('change', async () => {
                    const newExpiry = sel.value;
                    if (currentSymbol === 'NIFTY') Utils.saveExpiry(newExpiry);
                    await loadChain(currentSymbol, newExpiry);
                });
            }

            WS.connect();
        })();

        // ── WebSocket: live chain updates ──────────────────────────────

        WS.on('chain_update', (data) => {
            if (!data || !data.rows) return;
            // The scheduler only broadcasts the NIFTY active expiry. Ignore it
            // entirely when viewing a stock symbol, and ignore mismatched expiry
            // so the table isn't repainted with the wrong series.
            if (currentSymbol !== 'NIFTY') return;
            if (data.expiry && currentExpiry && data.expiry !== currentExpiry) return;
            chainData = data.rows.map(r => ({
                strike: r.strike,
                ce_oi: r.ce_oi || 0, ce_iv: r.ce_iv || 0,
                ce_ltp: r.ce_ltp || 0, ce_delta: r.ce_delta || 0,
                pe_oi: r.pe_oi || 0, pe_iv: r.pe_iv || 0,
                pe_ltp: r.pe_ltp || 0, pe_delta: r.pe_delta || 0,
            }));
            currentSpot = data.spot || currentSpot;
            renderChain();
        });

        WS.on('market_update', (data) => {
            if (data && data.nifty_spot) currentSpot = data.nifty_spot;
            Utils.updateRefreshInfo(data?.timestamp);
        });

        // ── Render chain table ─────────────────────────────────────────

        function renderChain() {
            const body = document.getElementById('chain-body');
            document.getElementById('chain-spot').textContent = Utils.formatNum(currentSpot, 2);

            if (!chainData.length) {
                body.innerHTML = '<tr><td colspan="9" class="text-center text-muted" style="padding:40px">No data</td></tr>';
                return;
            }

            const filterRange = document.getElementById('filter-range').checked;
            let rows = chainData;

            // Find ATM strike
            const atm = rows.reduce((best, r) =>
                Math.abs(r.strike - currentSpot) < Math.abs(best.strike - currentSpot) ? r : best
            );

            if (filterRange) {
                // Show only strikes within ±5% of spot
                const lo = currentSpot * 0.95;
                const hi = currentSpot * 1.05;
                rows = rows.filter(r => r.strike >= lo && r.strike <= hi);
            }

            // OI magnitude bars: scale each side's cell background against the
            // max OI among displayed strikes (CE bar grows from the right edge,
            // PE from the left — mirroring the table's CE|strike|PE layout).
            const maxOi = Math.max(1, ...rows.map(r => Math.max(r.ce_oi || 0, r.pe_oi || 0)));
            const oiBar = (oi, side) => {
                const pct = Math.round(Math.min(1, (oi || 0) / maxOi) * 100);
                if (!pct) return '';
                const col = side === 'CE' ? 'rgba(38,198,218,0.18)' : 'rgba(240,133,122,0.18)';
                const dir = side === 'CE' ? 'to left' : 'to right';
                return `background:linear-gradient(${dir}, ${col} ${pct}%, transparent ${pct}%)`;
            };

            let html = '';
            for (const r of rows) {
                const isAtm = r.strike === atm.strike;
                const rowClass = isAtm ? 'atm' : '';

                html += `<tr class="${rowClass}" onclick="onRowClick(${r.strike})" style="cursor:pointer">
                    <td class="ce-cell font-mono" style="${oiBar(r.ce_oi, 'CE')}">${r.ce_oi ? Utils.formatNum(r.ce_oi) : '-'}</td>
                    <td class="ce-cell font-mono">${r.ce_iv ? r.ce_iv.toFixed(1) : '-'}</td>
                    <td class="ce-cell font-mono fw-600">${r.ce_ltp ? r.ce_ltp.toFixed(2) : '-'}</td>
                    <td class="ce-cell font-mono">${r.ce_delta ? Math.abs(r.ce_delta).toFixed(3) : '-'}</td>
                    <td class="strike-cell">${Utils.formatNum(r.strike)}</td>
                    <td class="pe-cell font-mono">${r.pe_delta ? Math.abs(r.pe_delta).toFixed(3) : '-'}</td>
                    <td class="pe-cell font-mono fw-600">${r.pe_ltp ? r.pe_ltp.toFixed(2) : '-'}</td>
                    <td class="pe-cell font-mono">${r.pe_iv ? r.pe_iv.toFixed(1) : '-'}</td>
                    <td class="pe-cell font-mono" style="${oiBar(r.pe_oi, 'PE')}">${r.pe_oi ? Utils.formatNum(r.pe_oi) : '-'}</td>
                </tr>`;
            }

            body.innerHTML = html;

            // Scroll ATM into view
            const atmRow = body.querySelector('.atm');
            if (atmRow) {
                setTimeout(() => atmRow.scrollIntoView({ block: 'center', behavior: 'smooth' }), 100);
            }
        }

        // ── Row click: OTM-aware lookup fill ───────────────────────────

        function onRowClick(strike) {
            if (strike > currentSpot) {
                // OTM for CE
                document.getElementById('ce-lookup-strike').value = strike;
                lookupStrike('CE');
            } else if (strike < currentSpot) {
                // OTM for PE
                document.getElementById('pe-lookup-strike').value = strike;
                lookupStrike('PE');
            } else {
                // ATM — fill whichever is empty
                if (!lookupData.CE) {
                    document.getElementById('ce-lookup-strike').value = strike;
                    lookupStrike('CE');
                } else {
                    document.getElementById('pe-lookup-strike').value = strike;
                    lookupStrike('PE');
                }
            }
            // Scroll to top to show lookup
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ── Strike lookup ──────────────────────────────────────────────

        async function lookupStrike(side) {
            const input = document.getElementById(`${side.toLowerCase()}-lookup-strike`);
            const strike = parseInt(input.value);
            if (!strike) return;

            const resp = await API.strikeLookup(strike, side, currentExpiry, currentSymbol);
            if (resp && !resp.error) {
                lookupData[side] = resp;
                const prefix = side.toLowerCase();
                document.getElementById(`${prefix}-lkp-ltp`).textContent = resp.ltp.toFixed(2);
                document.getElementById(`${prefix}-lkp-delta`).textContent = Math.abs(resp.delta).toFixed(3);
                document.getElementById(`${prefix}-lkp-iv`).textContent = resp.iv.toFixed(1) + '%';

                const rankEl = document.getElementById(`${prefix}-lkp-rank`);
                rankEl.textContent = resp.premium_rank;
                rankEl.className = 'value badge ' + Utils.premiumRankClass(resp.premium_rank);

                const addRow = document.getElementById(`${prefix}-add-row`);
                addRow.classList.remove('hidden');
                addRow.style.display = 'flex';
            } else {
                Utils.toast(resp?.error || 'Lookup failed', 'error');
            }
        }

        // Handle Enter key on lookup inputs
        document.getElementById('ce-lookup-strike').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lookupStrike('CE');
        });
        document.getElementById('pe-lookup-strike').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lookupStrike('PE');
        });

        // ── Add trade from lookup ──────────────────────────────────────

        function addTradeFromLookup(side) {
            const data = lookupData[side];
            if (!data) return;

            const action = lookupAction[side] || 'SELL';
            const params = new URLSearchParams({
                action: 'add',
                type: side + '_' + action,
                strike: data.strike,
                premium: data.ltp,
                iv: data.iv,
                delta: data.delta,
                expiry: currentExpiry,
                symbol: currentSymbol,
            });
            if (currentLot) params.set('lot_size', currentLot);
            window.location.href = `/positions?${params.toString()}`;
        }
    </script>
